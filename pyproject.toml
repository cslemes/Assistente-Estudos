[project]
name = "assistente-aluno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepgram-sdk>= 6.1.1",
    "dotenv>=0.9.9",
    "fastapi>=0.135.2",
    "genanki>=0.13.1",
    "google-api-python-client>=2.193.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.3.0",
    "groq>=1.1.2",
    "ipykernel>=7.2.0",
    "openai>=2.28.0",
    "playwright>=1.58.0",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.17.1",
    "tqdm>=4.67.3",
    "transformers>=5.4.0",
    "uvicorn>=0.42.0",
    "streamlit>=1.45.0",
    "websockets>=16.0",
    "torch",
    "torchvision",
    "python-pptx>=1.0.2",
    "easyocr>=1.7.2",
    "boto3>=1.34.0",
    "onnxruntime-gpu>=1.25.0",
    "langsmith>=0.7.36",
    "fastembed>=0.8.0",
    "torchaudio>=2.11.0",
    "rapidfuzz>=3.14.5",
    "torchcodec>=0.13.0",
