services:
  gpu-workers:
    build:
      context: runpod_workers
      dockerfile: Dockerfile.local
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    depends_on:
      - gpu-workers
    env_file: .env
    environment:
      USE_RUNPOD: "true"
      RUNPOD_BASE_URL: "http://gpu-workers:8001/v2"
      RUNPOD_CLIP_ENDPOINT_ID: "clip"
      RUNPOD_EMBED_ENDPOINT_ID: "embed"
      RUNPOD_NER_ENDPOINT_ID: "ner"
      RUNPOD_OCR_ENDPOINT_ID: "ocr"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
