server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # Firebase SDK probes this on non-Firebase-Hosting deployments — return 404
    # so the SDK falls back to the config provided in firebase.ts
    location /__/firebase/ {
        return 404;
    }

    # Proxy API calls to the backend container
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
