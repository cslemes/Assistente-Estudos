services:
  api:
    image: ghcr.io/cslemes/assistente-api:latest
    env_file: .env
    environment:
      DOWNLOADS_BASE: /app/Downloads
    volumes:
      - ./assistente.db:/app/assistente.db
      - ./Downloads:/app/Downloads
    restart: unless-stopped

  frontend:
    image: ghcr.io/cslemes/assistente-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
